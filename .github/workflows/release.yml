name: Multi-Market Release (GitHub Releases + crates.io + PyPI + npm)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Release Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: veil-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: veil-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: veil-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release workspace (veil CLI & pii-veil-ffi)
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Audit Linux binary with GLASTOR® Byte-Gauge
        if: matrix.os == 'ubuntu-latest'
        uses: glastor-core/byte-gauge@v1
        with:
          path: "target/${{ matrix.target }}/release/veil"
        continue-on-error: true
      - name: Package Unix Archive (tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-pkg
          cp "target/${{ matrix.target }}/release/veil" dist-pkg/
          cp "crates/veil-ffi/include/pii_veil.h" dist-pkg/
          cp LICENSE-MIT LICENSE-APACHE README.md dist-pkg/
          tar -czf "${{ matrix.archive_name }}.tar.gz" -C dist-pkg .
      - name: Package Windows Archive (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/veil.exe" dist-pkg/
          Copy-Item "crates/veil-ffi/include/pii_veil.h" dist-pkg/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md dist-pkg/
          Compress-Archive -Path dist-pkg/* -DestinationPath "${{ matrix.archive_name }}.zip"
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            *.tar.gz
            *.zip

  github-release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release with Multi-OS Binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip

  publish-crates:
    name: Publish to crates.io (core, ffi, cli)
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish pii-veil-core, pii-veil-ffi & pii-veil-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
            exit 0
          fi
          echo "--> Publishing pii-veil-core..."
          cargo publish -p pii-veil-core || true

          echo "--> Waiting for pii-veil-core to appear in crates.io index..."
          for i in $(seq 1 24); do
            if cargo search pii-veil-core 2>/dev/null | grep -q "pii-veil-core"; then
              echo "pii-veil-core is available in crates.io!"
              break
            fi
            echo "Waiting for crates.io index ($i/24)..."
            sleep 10
          done

          echo "--> Publishing pii-veil-ffi..."
          cargo publish -p pii-veil-ffi || true

          echo "--> Waiting for pii-veil-ffi to appear in crates.io index..."
          for i in $(seq 1 24); do
            if cargo search pii-veil-ffi 2>/dev/null | grep -q "pii-veil-ffi"; then
              echo "pii-veil-ffi is available in crates.io!"
              break
            fi
            echo "Waiting for crates.io index ($i/24)..."
            sleep 10
          done

          echo "--> Publishing pii-veil-cli..."
          cargo publish -p pii-veil-cli || true

  publish-pypi:
    name: Publish Python Wheel to PyPI (Maturin)
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build & Upload to PyPI (if PYPI_API_TOKEN is configured)
        if: env.MATURIN_PYPI_TOKEN != ''
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/veil-py
          command: publish
          args: -i python3.9 -i python3.10 -i python3.11 -i python3.12 -i python3.13 --skip-existing

  publish-npm:
    name: Publish Node.js Addon to npm (napi-rs)
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and publish pii-veil-node (if NPM_TOKEN is configured)
        working-directory: crates/veil-node
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN not set, skipping npm publish"
            exit 0
          fi
          npm install
          npm run build
          npm publish --access public
