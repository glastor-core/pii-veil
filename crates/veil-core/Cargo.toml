[package]
name = "pii-veil-core"
description = "Ultrafast, deterministic, and reversible PII & secret anonymization engine for LLMs, logs, and SQL streams."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
# Opt-in Tier-1 contextual NER detector for unstructured Person Names & Street Addresses.
ner = []

[dependencies]
aho-corasick = "1.1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac", "sha2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_throughput"
harness = false
